<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=auto"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="知序 web UI — chat with your 知序 workspace."
      data-i18n-meta="description"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      data-theme-color-light="#ffffff"
      data-theme-color-dark="#111621"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="知序" />
    <link rel="icon" type="image/png" href="/brand/zhixu_logo.png" />
    <link rel="apple-touch-icon" href="/brand/zhixu_logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* App-like feel on touch devices: no double-tap zoom on interactive
         elements (system-level accessibility zoom still works), and no text
         size inflation on orientation change. */
      html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      body {
        margin: 0;
        background: hsl(var(--background, 0 0% 100%));
        color: hsl(var(--foreground, 222 30% 16%));
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        font-family: var(--font-ui, system-ui, sans-serif);
      }

      html.dark body {
        background: hsl(var(--background, 220 24% 8%));
        color: hsl(var(--foreground, 214 22% 92%));
      }

      .boot-splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }

      .boot-splash-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(10, 10, 10, 0.64);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: currentColor;
        opacity: 0.75;
        animation: boot-pulse 1s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.45;
        }
        50% {
          transform: scale(1);
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        // One-shot migration from the legacy `nanobot-*` localStorage keys so
        // an upgrade does not silently reset the user's theme / locale.
        // Read new key first; fall back to the old key and copy it forward.
        try {
          if (new URLSearchParams(window.location.search).get("preview") === "1") return;
          for (var pair of [
            ["zhixu-webui.theme", "nanobot-webui.theme"],
            ["zhixu.locale", "nanobot.locale"],
          ]) {
            var next = localStorage.getItem(pair[0]);
            if (next === null) {
              var legacy = localStorage.getItem(pair[1]);
              if (legacy !== null) {
                localStorage.setItem(pair[0], legacy);
                localStorage.removeItem(pair[1]);
              }
            } else if (localStorage.getItem(pair[1]) !== null) {
              localStorage.removeItem(pair[1]);
            }
          }
        } catch {}
      })();
      (function () {
        try {
          // Version 1 cache protocol; keep validation aligned with appearance.ts.
          // Only fixed properties with validated values reach style.setProperty.
          var preview = new URLSearchParams(window.location.search).get("preview") === "1";
          var source = null, legacy = null;
          if (!preview) {
            try {
              var raw = localStorage.getItem("zhixu-webui.appearance");
              if (raw !== null) {
                try { source = JSON.parse(raw); } catch {}
              } else legacy = localStorage.getItem("zhixu-webui.theme");
            } catch {}
          }
          function object(value) { return value && typeof value === "object" && !Array.isArray(value) ? value : {}; }
          function preset(value) { return ["zhixu", "graphite", "ocean", "sand"].indexOf(value) !== -1; }
          function hex(value) {
            if (typeof value !== "string") return null;
            value = value.trim().replace(/^#/, "");
            if (/^[0-9a-f]{3}$/i.test(value)) value = value.split("").map(function (c) { return c + c; }).join("");
            return /^[0-9a-f]{6}$/i.test(value) ? "#" + value.toUpperCase() : null;
          }
          function font(value, kind) {
            value = object(value);
            var ids = kind === "ui" ? ["system", "sans", "serif"] : ["default", "consolas", "cascadia", "jetbrains"];
            if (ids.indexOf(value.id) !== -1) return { id: value.id, family: "" };
            var family = typeof value.family === "string" ? value.family.trim() : "";
            if (value.id === "custom" && family && family.length <= 80 && !/[\u0000-\u001f\u007f]/.test(value.family) && /^[\p{L}\p{N} _.-]+$/u.test(family)) return { id: "custom", family: family };
            return { id: ids[0], family: "" };
          }
          function overrides(value) {
            value = object(value);
            var result = {};
            ["accent", "background", "foreground"].forEach(function (field) { var color = hex(value[field]); if (color) result[field] = color; });
            return result;
          }
          var value = object(source), custom = object(value.custom);
          var validVersion = value.schemaVersion === 1;
          var normalizedCustom = validVersion && preset(custom.basePreset) ? { basePreset: custom.basePreset, light: overrides(custom.light), dark: overrides(custom.dark) } : null;
          var preferences = {
            schemaVersion: 1,
            mode: validVersion && (value.mode === "light" || value.mode === "dark") ? value.mode : legacy === "light" || legacy === "dark" ? legacy : "system",
            presetId: validVersion && preset(value.presetId) ? value.presetId : validVersion && value.presetId === "custom" && normalizedCustom ? "custom" : "zhixu",
            custom: normalizedCustom,
            uiFont: font(validVersion ? value.uiFont : null, "ui"),
            codeFont: font(validVersion ? value.codeFont : null, "code")
          };
          var dark = preferences.mode === "dark" || (preferences.mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", !!dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var canonical = JSON.stringify(preferences), hash = 2166136261;
          for (var i = 0; i < canonical.length; i++) hash = Math.imul(hash ^ canonical.charCodeAt(i), 16777619);
          var hslKeys = ["background", "foreground", "card", "popover", "primary", "primary-foreground", "secondary", "muted", "muted-foreground", "accent", "accent-foreground", "border", "surface-app", "surface-panel", "sidebar", "sidebar-accent", "nav-active-bg", "nav-active-fg", "nav-active-ring", "card-foreground", "popover-foreground", "secondary-foreground", "input", "ring", "border-soft", "temporary-accent", "temporary-foreground", "temporary-border", "sidebar-foreground", "sidebar-selected", "sidebar-accent-foreground", "sidebar-border", "settings-canvas", "settings-surface"];
          var hexKeys = ["inline-token-highlight", "temporary-control-active", "appearance-safe-foreground"];
          var fontKeys = ["font-ui", "font-code", "font-display"];
          var allKeys = hslKeys.concat(hexKeys, fontKeys).map(function (key) { return "--" + key; });
          function safeSnapshot(snapshot) {
            if (!snapshot || typeof snapshot !== "object" || Object.keys(snapshot).length !== allKeys.length) return false;
            return allKeys.every(function (key) {
              var val = snapshot[key];
              if (typeof val !== "string") return false;
              if (hexKeys.indexOf(key.slice(2)) !== -1) return !!hex(val) && /^#[0-9a-f]{6}$/i.test(val);
              if (fontKeys.indexOf(key.slice(2)) !== -1) return val.length <= 1024 && /^[\p{L}\p{N} _.,"'-]+$/u.test(val);
              var match = /^(\d+(?:\.\d+)?) (\d+(?:\.\d+)?)% (\d+(?:\.\d+)?)%$/.exec(val);
              return !!match && +match[1] <= 360 && +match[2] <= 100 && +match[3] <= 100;
            });
          }
          var snapshot = object(value.snapshot);
          var validSnapshot = validVersion && snapshot.version === 1 && snapshot.signature === (hash >>> 0).toString(16) && safeSnapshot(snapshot.light) && safeSnapshot(snapshot.dark);
          if (validSnapshot) {
            var selected = dark ? snapshot.dark : snapshot.light;
            allKeys.forEach(function (key) { root.style.setProperty(key, selected[key]); });
            root.dataset.appearanceTheme = preferences.presetId;
            root.dataset.appearanceFont = preferences.uiFont.id;
          } else {
            root.style.setProperty("--background", dark ? "220 24% 8%" : "0 0% 100%");
            root.style.setProperty("--foreground", dark ? "214 22% 92%" : "222 30% 16%");
            root.style.setProperty("--primary", dark ? "217 70% 70%" : "221 58% 44%");
            root.dataset.appearanceTheme = "zhixu";
            root.dataset.appearanceFont = "system";
          }
          function hslHex(input) {
            var parts = input.split(" "), h = parseFloat(parts[0]), s = parseFloat(parts[1]) / 100, l = parseFloat(parts[2]) / 100;
            var a = s * Math.min(l, 1 - l);
            return "#" + [0, 8, 4].map(function (n) {
              var k = (n + h / 30) % 12;
              return Math.round((l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255).toString(16).padStart(2, "0");
            }).join("").toUpperCase();
          }
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", hslHex(root.style.getPropertyValue("--background")));
        } catch {}
      })();
    </script>
    <title>知序</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-inner">
          <span class="boot-dot" aria-hidden="true"></span>
          <span data-boot-copy>Loading 知序…</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var localeKey = "zhixu.locale";
        var copy = {
          en: {
            boot: "Loading 知序…",
            description: "知序 web UI — chat with your 知序 workspace."
          },
          "zh-CN": {
            boot: "正在加载 知序…",
            description: "知序 Web UI —— 与你的 知序 工作区对话。"
          },
          "zh-TW": {
            boot: "正在載入 知序…",
            description: "知序 Web UI —— 與你的 知序 工作區對話。"
          },
          fr: {
            boot: "Chargement de 知序…",
            description: "Interface web 知序 — discutez avec votre espace de travail 知序."
          },
          ja: {
            boot: "知序 を読み込み中…",
            description: "知序 Web UI — 知序 ワークスペースと会話します。"
          },
          ko: {
            boot: "知序 불러오는 중…",
            description: "知序 웹 UI — 知序 작업공간과 대화하세요."
          },
          es: {
            boot: "Cargando 知序…",
            description: "Interfaz web de 知序: conversa con tu espacio de trabajo de 知序."
          },
          "pt-BR": {
            boot: "Carregando 知序…",
            description: "Interface web do 知序 — converse com o seu espaço de trabalho do 知序."
          },
          vi: {
            boot: "Đang tải 知序…",
            description: "Giao diện web 知序 — trò chuyện với không gian làm việc 知序 của bạn."
          },
          id: {
            boot: "Memuat 知序…",
            description: "UI web 知序 — ngobrol dengan ruang kerja 知序 Anda."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          if (lower === "pt" || lower.indexOf("pt-") === 0) {
            return "pt-BR";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          var boot = document.querySelector("[data-boot-copy]");
          if (boot) boot.textContent = localized.boot;
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
