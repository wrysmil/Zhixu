<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知序</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center;
        background: #ffffff; color: #121212;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif; }
      @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #f5f5f5; }
        p { color: rgba(245, 245, 245, 0.62); }
        button { background: #212121; color: #f5f5f5; border-color: rgba(245, 245, 245, 0.14); }
        button:hover { background: #2b2b2b; }
      }
      .card { display: flex; flex-direction: column; align-items: center; gap: 18px;
        max-width: 520px; padding: 0 24px; text-align: center; }
      .mark { width: 88px; height: 88px; animation: breathe 1.8s ease-in-out infinite;
        object-fit: contain; }
      @keyframes breathe {
        0%, 100% { transform: scale(0.97); opacity: 0.85; }
        50% { transform: scale(1); opacity: 1; }
      }
      h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: 0.2px; }
      p { margin: 0; font-size: 14px; line-height: 1.7; color: rgba(18, 18, 18, 0.62);
        white-space: pre-wrap; }
      button { display: none; border: 1px solid rgba(18, 18, 18, 0.12);
        background: #fafafa; color: #121212; border-radius: 12px;
        padding: 8px 22px; font-size: 14px; cursor: pointer; }
      button:hover { background: #ededed; }
      button.visible { display: inline-block; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="mark" src="assets/icon.png" alt="" aria-hidden="true" draggable="false" />
      <h1>知序</h1>
      <p id="status">正在启动…</p>
      <button id="retry" type="button">重试</button>
    </div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var msg = q.get("msg");
        if (msg && msg !== "smoke") document.getElementById("status").textContent = msg;
        if (q.get("retry") === "1") {
          var btn = document.getElementById("retry");
          btn.classList.add("visible");
          btn.addEventListener("click", function () {
            if (window.mira && window.mira.retryBoot) window.mira.retryBoot();
          });
        }
      })();
    </script>
  </body>
</html>
